<div class="edit-dialog">
  <div class="dialog-header">
    <div class="dialog-icon-wrap">
      <mat-icon class="dialog-icon">edit_note</mat-icon>
    </div>
    <div>
      <h2 class="dialog-title">Edit Task</h2>
      <p class="dialog-subtitle">Modify the task details below</p>
    </div>
  </div>

  <form [formGroup]="updateTaskForm" (submit)="updateTasks()" id="edit-task-form">

    <mat-form-field appearance="fill" class="dialog-field">
      <mat-label>Task Title</mat-label>
      <input id="edit-title-input" formControlName="title" matInput placeholder="Enter task title" maxlength="128">
      <mat-hint align="end">{{ updateTaskForm.get('title')?.value?.length || 0 }} / 128</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="fill" class="dialog-field">
      <mat-label>Due Date (Optional)</mat-label>
      <mat-icon matPrefix class="field-icon">event</mat-icon>
      <mat-datepicker #dueDate></mat-datepicker>
      <input matInput id="edit-due-date-input" formControlName="dueDate" [matDatepicker]="dueDate">
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="dueDate"></mat-datepicker-toggle>
    </mat-form-field>

    <mat-form-field appearance="fill" class="dialog-field">
      <mat-label>Description (Optional)</mat-label>
      <mat-icon matPrefix class="field-icon">notes</mat-icon>
      <textarea matInput id="edit-description-input" formControlName="description"
        placeholder="Add a detailed description..." rows="3"></textarea>
    </mat-form-field>

    <div class="dialog-actions">
      <button id="edit-cancel-btn" mat-stroked-button class="btn-cancel" [mat-dialog-close]="false">
        <mat-icon>close</mat-icon> Cancel
      </button>
      <button id="edit-update-btn" mat-flat-button class="btn-update" type="submit"
        [disabled]="updateTaskForm.invalid" [mat-dialog-close]="true">
        <mat-icon>save</mat-icon> Update
      </button>
    </div>
  </form>
</div>
