<div class="add-task-wrap">
  <div class="panel-header">
    <mat-icon class="panel-icon">add_task</mat-icon>
    <h2 class="panel-title">New Task</h2>
  </div>

  <form [formGroup]="addTaskForm" (submit)="addTask()" id="add-task-form">

    <mat-form-field appearance="fill" class="task-field">
      <mat-label>Task title</mat-label>
      <input id="task-title-input" formControlName="title" matInput placeholder="What needs to be done?" maxlength="128">
      <mat-hint align="end">{{ addTaskForm.get('title')?.value?.length || 0 }} / 128</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="fill" class="task-field">
      <mat-label>Due Date (Optional)</mat-label>
      <mat-icon matPrefix class="field-prefix-icon">event</mat-icon>
      <input matInput formControlName="dueDate" [matDatepicker]="dueDate" [min]="minDate" id="due-date-input">
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="dueDate"></mat-datepicker-toggle>
      <mat-datepicker #dueDate></mat-datepicker>
    </mat-form-field>

    <div class="action-buttons">
      <button
        id="add-task-btn"
        class="btn-add"
        mat-flat-button
        [disabled]="addTaskForm.invalid || addTaskForm.pristine"
        (click)="addTask()">
        <mat-icon>add</mat-icon>
        Add Task
      </button>
      <button
        id="clear-task-btn"
        class="btn-clear"
        mat-stroked-button
        type="reset"
        (click)="resetForm()">
        <mat-icon>close</mat-icon>
        Clear
      </button>
    </div>
  </form>
</div>
