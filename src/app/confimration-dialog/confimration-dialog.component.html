<div class="confirm-dialog">
  <div class="confirm-icon-wrap">
    <mat-icon class="confirm-icon">delete_forever</mat-icon>
  </div>
  <h2 class="confirm-title">Delete Task?</h2>
  <p class="confirm-message">
    You are about to permanently delete <strong>"{{ data.title }}"</strong>. This action cannot be undone.
  </p>
  <div class="confirm-actions">
    <button id="confirm-cancel-btn" mat-stroked-button class="btn-cancel" [mat-dialog-close]="false">
      <mat-icon>close</mat-icon> Cancel
    </button>
    <button id="confirm-delete-btn" mat-flat-button class="btn-delete" [mat-dialog-close]="true">
      <mat-icon>delete</mat-icon> Delete
    </button>
  </div>
</div>
